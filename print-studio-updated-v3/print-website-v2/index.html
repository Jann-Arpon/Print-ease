<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ALJ Print Services: copy, print, and general merchandise.">
  <title>ALJ Print Services</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-home">
  <div class="site-wrap site-wrap--home-simple">
    <header class="site-header">
      <a class="brand-lockup" href="index.html">ALJ PRINT SERVICES</a>
      <a class="staff-login-link" href="login.html">Staff login</a>
    </header>

    <main class="home-main home-main--full">
      <a class="print-portal print-portal--full reveal" href="services.html" aria-label="Start printing: choose a service">
        <span class="print-portal__grain" aria-hidden="true"></span>
        <span class="print-portal__topline"><span>ALJ PRINT SERVICES</span><span>COPY · PRINT · MERCHANDISE</span></span>
        <img class="landing-logo" src="assets/alj-logo.svg" alt="ALJ Copy Print and General Merchandise">
        <span class="print-portal__bottom"><span class="portal-caption">PRINTING AND COPYING FOR EVERYDAY NEEDS</span><span class="portal-button"><span>START PRINTING</span><span class="portal-button__icon" aria-hidden="true">↗</span></span></span>
      </a>
      <a class="home-scroll-hint" href="#merchandise-heading">SCROLL FOR MORE <span aria-hidden="true">↓</span></a>
    </main>

    <section class="merchandise-section" aria-labelledby="merchandise-heading">
      <div class="merchandise-content">
        <h2 id="merchandise-heading">Explore Merchandise</h2>
        <div class="merchandise-grid">
          <article class="merchandise-item">
            <div class="merchandise-placeholder" aria-hidden="true"></div>
            <h3>Merchandise 1</h3>
          </article>
          <article class="merchandise-item">
            <div class="merchandise-placeholder" aria-hidden="true"></div>
            <h3>Merchandise 2</h3>
          </article>
          <article class="merchandise-item">
            <div class="merchandise-placeholder" aria-hidden="true"></div>
            <h3>Merchandise 3</h3>
          </article>
          <article class="merchandise-item">
            <div class="merchandise-placeholder" aria-hidden="true"></div>
            <h3>Merchandise 4</h3>
          </article>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span>© <span data-year></span> ALJ PRINT SERVICES</span>
    </footer>
  </div>
</body>
</html>
