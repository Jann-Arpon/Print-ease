<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A creative print shop website — paper, mugs, tarpaulins, and pictures.">
  <title>PRINT Studio — Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-home">
  <div class="site-wrap site-wrap--home-simple">
    <header class="site-header">
      <div class="brand-lockup">
        <div class="logo-slot" aria-label="Empty business logo area"></div>
        <div class="credit-lockup"><span class="credit-rule"></span><span class="credit-text">YOUR BUSINESS OWNER CREDIT</span></div>
      </div>
      <button type="button" class="login-button" disabled aria-label="Login, coming soon">LOG IN <span aria-hidden="true">↗</span></button>
    </header>

    <main class="home-main home-main--full">
      <a class="print-portal print-portal--full reveal" href="services.html" aria-label="PRINT — open the printing categories on a new page">
        <span class="print-portal__grain" aria-hidden="true"></span>
        <span class="print-portal__topline"><span>THE CREATIVE CORNER</span><span>PRESS TO EXPLORE ↗</span></span>
        <span class="print-word" aria-hidden="true"><span class="photo-letter photo-letter--p">P</span><span class="photo-letter photo-letter--r">R</span><span class="photo-letter photo-letter--i">I</span><span class="photo-letter photo-letter--n">N</span><span class="photo-letter photo-letter--t">T</span><span class="print-dot">.</span></span>
        <span class="print-portal__bottom"><span class="portal-caption">TAKE YOUR IDEAS OFF THE SCREEN</span><span class="portal-button" aria-hidden="true"><span>EXPLORE</span><span class="portal-button__icon">↗</span></span></span>
      </a>
    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> YOUR PRINT SHOP — EDIT THIS TEXT</span>
    </footer>
  </div>
</body>
</html>
