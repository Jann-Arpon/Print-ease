<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore paper, mug, tarpaulin and picture printing services.">
  <title>PRINT Studio — Explore Services</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-services">
  <div class="site-wrap site-wrap--services-simple">
    <main class="services-main services-main--simple">
      <a class="back-home back-home--top" href="index.html">← <span>BACK TO HOME</span></a>

      <div class="category-list category-list--simple" id="categoryList">
        <button class="category-card category-card--paper reveal" type="button" aria-label="Paper printing category">
          <span class="category-title">PAPER<span class="category-period">.</span></span>
          <span class="category-illustration paper-illustration" aria-hidden="true"><span class="paper-stack paper-stack--back"></span><span class="paper-stack paper-stack--front"><i></i><i></i><i></i><b>INK.</b></span></span>
        </button>

        <button class="category-card category-card--mug reveal" type="button" aria-label="Mug printing category">
          <span class="category-title">MUG<span class="category-period">.</span></span>
          <span class="category-illustration mug-illustration" aria-hidden="true"><span class="mug-handle"></span><span class="mug-body"><span>GOOD<br>IDEAS.</span></span><span class="mug-saucer"></span></span>
        </button>

        <button class="category-card category-card--tarp reveal" type="button" aria-label="Tarp printing category">
          <span class="category-title">TARP<span class="category-period">.</span></span>
          <span class="category-illustration tarp-illustration" aria-hidden="true"><span class="tarp-banner"><span class="tarp-pin tarp-pin--a"></span><span class="tarp-pin tarp-pin--b"></span><strong>BIG<br>IDEAS!</strong><span class="tarp-pin tarp-pin--c"></span><span class="tarp-pin tarp-pin--d"></span></span></span>
        </button>

        <button class="category-card category-card--picture reveal" type="button" aria-label="Picture printing category">
          <span class="category-title">PICTURE<span class="category-period">.</span></span>
          <span class="category-illustration picture-illustration" aria-hidden="true"><span class="picture-print picture-print--back"><span class="photo-scene photo-scene--back"></span></span><span class="picture-print picture-print--front"><span class="photo-scene photo-scene--front"><i></i></span></span></span>
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <a href="index.html" class="footer-back-link">← BACK TO HOME</a>
      <span>© <span data-year></span> YOUR PRINT SHOP — EDIT THIS TEXT</span>
    </footer>
  </div>
</body>
</html>
