<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore paper, mug, tarpaulin and picture printing services.">
  <title>PRINT Studio — Explore Services</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-services">
  <div class="site-wrap site-wrap--services-simple">
    <main class="services-main services-main--simple">
      <a class="back-home back-home--top" href="index.html">← <span>BACK TO HOME</span></a>

      <label class="service-search-label" for="serviceSearch">Search services</label>
      <input class="service-search" id="serviceSearch" type="search" placeholder="Search paper, mugs, shirts..." autocomplete="off">
      <p class="service-search-empty" id="serviceSearchEmpty" hidden>No services match your search.</p>

      <div class="category-list category-list--simple" id="categoryList">
        <a class="category-card category-card--paper reveal" href="services/paper.html" aria-label="Paper printing category" data-search="paper printing documents photocopy">
          <span class="category-title">PAPER<span class="category-period">.</span></span>
          <span class="category-illustration paper-illustration" aria-hidden="true"><span class="paper-stack paper-stack--back"></span><span class="paper-stack paper-stack--front"><i></i><i></i><i></i><b>INK.</b></span></span>
        </a>

        <a class="category-card category-card--mug reveal" href="services/mug.html" aria-label="Mug printing category" data-search="mug cup cups">
          <span class="category-title">MUG<span class="category-period">.</span></span>
          <span class="category-illustration mug-illustration" aria-hidden="true"><span class="mug-handle"></span><span class="mug-body"><span>GOOD<br>IDEAS.</span></span><span class="mug-saucer"></span></span>
        </a>

        <a class="category-card category-card--tarp reveal" href="services/tarp.html" aria-label="Tarp printing category" data-search="tarp tarpaulin banner banners">
          <span class="category-title">TARP<span class="category-period">.</span></span>
          <span class="category-illustration tarp-illustration" aria-hidden="true"><span class="tarp-banner"><span class="tarp-pin tarp-pin--a"></span><span class="tarp-pin tarp-pin--b"></span><strong>BIG<br>IDEAS!</strong><span class="tarp-pin tarp-pin--c"></span><span class="tarp-pin tarp-pin--d"></span></span></span>
        </a>

        <a class="category-card category-card--picture reveal" href="services/picture.html" aria-label="Picture printing category" data-search="picture photo photo print prints">
          <span class="category-title">PICTURE<span class="category-period">.</span></span>
          <span class="category-illustration picture-illustration" aria-hidden="true"><span class="picture-print picture-print--back"><span class="photo-scene photo-scene--back"></span></span><span class="picture-print picture-print--front"><span class="photo-scene photo-scene--front"><i></i></span></span></span>
        </a>

        <a class="category-card category-card--text reveal" href="services/tshirts.html" aria-label="T-shirt printing category" data-search="t-shirt t-shirts tshirt tshirts shirt shirts">
          <span class="category-title">T-SHIRTS<span class="category-period">.</span></span>
        </a>

        <a class="category-card category-card--text reveal" href="services/stickers.html" aria-label="Sticker printing category" data-search="sticker stickers decal decals">
          <span class="category-title">STICKERS<span class="category-period">.</span></span>
        </a>

        <a class="category-card category-card--text reveal" href="services/flyers.html" aria-label="Flyer printing category" data-search="flyer flyers leaflet leaflets">
          <span class="category-title">FLYERS<span class="category-period">.</span></span>
        </a>

        <a class="category-card category-card--text reveal" href="services/brochures.html" aria-label="Brochure printing category" data-search="brochure brochures pamphlet pamphlets">
          <span class="category-title">BROCHURES<span class="category-period">.</span></span>
        </a>

        <a class="category-card category-card--text reveal" href="services/postcards.html" aria-label="Postcard printing category" data-search="postcard postcards post card cards">
          <span class="category-title">POSTCARDS<span class="category-period">.</span></span>
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <a href="index.html" class="footer-back-link">← BACK TO HOME</a>
      <span>© <span data-year></span> YOUR PRINT SHOP — EDIT THIS TEXT</span>
    </footer>
  </div>
</body>
</html>
